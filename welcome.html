<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Welcome to Veloura Cafe"
    >

    <title>Veloura Cafe | Welcome</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/welcome.css"
    >

</head>


<body>


    <main class="welcome-page">


        <!-- BACKGROUND LIGHT -->

        <div class="spotlight"></div>

        <div class="background-glow glow-one"></div>

        <div class="background-glow glow-two"></div>

        <div class="background-glow glow-three"></div>


        <!-- PARTICLES -->

        <div class="particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- TEXTURE -->

        <div class="background-lines"></div>

        <div class="grain"></div>


        <!-- 3D ORBITS -->

        <div class="orbit-system">

            <div class="luxury-orbit orbit-one"></div>

            <div class="luxury-orbit orbit-two"></div>

            <div class="luxury-orbit orbit-three"></div>

            <div class="luxury-orbit orbit-four"></div>

        </div>



        <!-- MAIN CONTENT -->

        <section
            class="welcome-content"
            id="welcomeContent"
        >


            <!-- LOGO -->

            <div class="welcome-logo">

                <div class="logo-outer-ring">

                    <div class="logo-circle">

                        <span>V</span>

                    </div>

                </div>

            </div>



            <!-- WELCOME -->

            <p class="welcome-small">

                WELCOME TO

            </p>



            <!-- MAIN TITLE -->

            <div class="brand-title">

                <span class="letter">V</span>
                <span class="letter">E</span>
                <span class="letter">L</span>
                <span class="letter">O</span>
                <span class="letter">U</span>
                <span class="letter">R</span>
                <span class="letter">A</span>

                <div class="title-light"></div>

            </div>



            <!-- CAFE -->

            <h2 class="cafe-title">

                CAFE

            </h2>



            <!-- DIVIDER -->

            <div class="gold-divider">

                <span class="divider-line"></span>

                <div class="diamond"></div>

                <span class="divider-line"></span>

            </div>



            <!-- TAGLINE -->

            <p class="welcome-tagline">

                WHERE EVERY CUP TELLS A STORY

            </p>



            <!-- LOCATION -->

            <p class="established">

                AL AIN · UAE

                <span></span>

                EST. 2026

            </p>


        </section>



        <!-- LOADING -->

        <div class="welcome-loading">

            <div class="loading-track">

                <span
                    class="loading-progress"
                    id="loadingProgress"
                ></span>

            </div>


            <div class="loading-info">

                <span>
                    PREPARING YOUR VELOURA EXPERIENCE
                </span>

                <span id="loadingNumber">
                    0%
                </span>

            </div>

        </div>



        <!-- EXIT -->

        <div
            class="exit-transition"
            id="exitTransition"
        >

            <div class="exit-circle"></div>

        </div>


    </main>



    <script src="js/welcome.js"></script>


</body>

</html>
