<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Welcome to VelouraCafe"
    >

    <title>Veloura | Welcome</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/intro.css"
    >

</head>


<body>


    <main class="intro-page">


        <!-- BACKGROUND -->

        <div class="ambient ambient-one"></div>

        <div class="ambient ambient-two"></div>

        <div class="ambient ambient-three"></div>

        <div class="grain"></div>



        <!-- HEADER -->

        <header class="intro-header">


            <div class="brand-lockup">


                <div class="brand-symbol">

                    V

                </div>


                <div class="brand-word">

                    VELOURA

                </div>


            </div>


        </header>



        <!-- MAIN -->

        <section class="intro-shell">


            <!-- PRODUCT WINDOW -->

            <div
                class="product-window"
                id="productWindow"
            >


                <div class="depth-ring depth-ring-one"></div>

                <div class="depth-ring depth-ring-two"></div>


                <div
                    class="slides-track"
                    id="slidesTrack"
                >


                    <!-- SLIDE 1 -->

                    <article class="product-slide">


                        <div class="slide-glow"></div>


                        <div class="product-depth-layer">


                            <img
                                src="assets/images/intro-cappuccino.png"
                                alt="Veloura cappuccino"
                                class="product-image"
                            >


                        </div>


                    </article>



                    <!-- SLIDE 2 -->

                    <article class="product-slide">


                        <div class="slide-glow"></div>


                        <div class="product-depth-layer">


                            <img
                                src="assets/images/intro-iced-coffee.png"
                                alt="Veloura iced coffee"
                                class="product-image"
                            >


                        </div>


                    </article>



                    <!-- SLIDE 3 -->

                    <article class="product-slide">


                        <div class="slide-glow"></div>


                        <div class="product-depth-layer">


                            <img
                                src="assets/images/intro-dessert-drink.png"
                                alt="Veloura dessert drink"
                                class="product-image"
                            >


                        </div>


                    </article>


                </div>


                <div class="panel-shine"></div>

                <div class="panel-edge-light"></div>


            </div>



            <!-- DOTS -->

            <div class="slider-dots">


                <button
                    class="slider-dot active"
                    data-slide="0"
                    aria-label="Slide 1"
                ></button>


                <button
                    class="slider-dot"
                    data-slide="1"
                    aria-label="Slide 2"
                ></button>


                <button
                    class="slider-dot"
                    data-slide="2"
                    aria-label="Slide 3"
                ></button>


            </div>



            <!-- TEXT -->

            <div
                class="intro-copy"
                id="introCopy"
            >


                <p class="intro-kicker">

                    A TASTE OF VELOURA

                </p>


                <h1 id="introTitle">

                    Coffee made
                    <br>
                    to be remembered.

                </h1>


                <p
                    class="intro-description"
                    id="introDescription"
                >

                    Smooth, elegant and thoughtfully crafted
                    for your everyday moments.

                </p>


            </div>



            <!-- BUTTON -->

            <button
                class="get-started-button locked"
                id="getStartedButton"
                aria-disabled="true"
            >


                <span class="button-lock">

                    ✦

                </span>


                <span
                    class="button-label"
                    id="buttonLabel"
                >

                    VIEW ALL 3 TO CONTINUE

                </span>


                <span class="button-icon">

                    →

                </span>


            </button>


            <p
                class="progress-note"
                id="progressNote"
            >

                Explore all three Veloura creations first.

            </p>


        </section>



        <!-- BOTTOM -->

        <div class="bottom-meta">

            <span>
                AL AIN · UAE
            </span>

            <span>
                EST. 2026
            </span>

        </div>


    </main>



    <!-- PAGE TRANSITION -->

    <div
        class="page-transition"
        id="pageTransition"
    >


        <div class="transition-ring"></div>


        <div class="transition-brand">

            VELOURA

        </div>


        <div class="transition-subtitle">

            WHERE EVERY CUP TELLS A STORY

        </div>


    </div>



    <script src="js/intro.js"></script>


</body>

</html>
